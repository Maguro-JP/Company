# Company の Setup.exe を組む。main では Release に置き、手で起こしたときは artifact に置く。
# 組むのは Linux の上（NSIS）。組んだ物は Windows のランナーに入れて、起動と画面まで見る。
# 作業ブランチ（claude/*）の push では回さない（手元で確かめ、CI は手元に無い Windows の確認だけに使う）。
name: setup
on:
  push:
    branches: [main]
    paths:
      - "company/**"
      - "ui/**"
      - "agents/**"
      - "product/**"
      - "app.py"
      - "company.yaml"
      - "tests/**"
      - "VERSION"
      - "packaging/company/**"
      - ".github/workflows/setup.yml"
  workflow_dispatch: {}
permissions:
  contents: write            # Release に置くため
concurrency:
  group: setup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Setup.exe を組む
        run: sh packaging/company/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Company-Setup
          path: dist/Company-Setup.exe
          retention-days: 7

  windows:
    # 手元に無い Windows の確認。黙って入れ、同梱の Python でテストを流し、アプリのウィンドウが開くかを見る
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Company-Setup
          path: dist
      - name: 黙って入れる
        shell: pwsh
        run: |
          Start-Process -FilePath "dist\Company-Setup.exe" -ArgumentList "/S" -Wait
          $dir = "$env:ProgramFiles\Company"
          if (-not (Test-Path "$dir\python\python.exe")) { throw "入っていない: $dir" }
          Get-ChildItem $dir | Select-Object Name | Format-Table -HideTableHeaders
          $ws = "$env:ProgramData\Company"
          if (-not (Test-Path "$ws\company.yaml")) { Get-Content "$ws\migrate.log" -ErrorAction SilentlyContinue; throw "作業場が無い: $ws" }
          "workspace: " + ((Get-ChildItem $ws | ForEach-Object { $_.Name }) -join ",")
          if (-not (Test-Path "$env:SystemDrive\LLM\gguf")) { throw "模型の置き場が無い" }
      - name: 同梱の Python で会社のテストを流す
        shell: pwsh
        run: |
          $py = "$env:ProgramFiles\Company\python\python.exe"
          & $py -c "import webview, fastapi, uvicorn, yaml, llama_cpp, anthropic; print('import ok')"
          if ($LASTEXITCODE -ne 0) { throw "import が落ちた" }
          $env:PYTHONUTF8 = "1"
          & $py -m unittest discover -s tests -t .
          if ($LASTEXITCODE -ne 0) { throw "テストが落ちた" }
      - name: アプリのウィンドウが開く
        shell: pwsh
        run: |
          $dir = "$env:ProgramFiles\Company"
          # pythonw だと落ちても何も残らないので、python.exe で出力をファイルに取る
          $p = Start-Process -FilePath "$dir\python\python.exe" -ArgumentList "-u","app.py","--port","8765" -WorkingDirectory $dir -PassThru -RedirectStandardOutput "$env:GITHUB_WORKSPACE\app.log" -RedirectStandardError "$env:GITHUB_WORKSPACE\app.err"
          $url = $null
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            $m = Select-String -Path "$env:GITHUB_WORKSPACE\app.log" -Pattern "http://127\.0\.0\.1:\d+" -ErrorAction SilentlyContinue
            if ($m) { $url = $m.Matches[0].Value; break }
          }
          Get-Content "$env:GITHUB_WORKSPACE\app.log" -ErrorAction SilentlyContinue
          Get-Content "$env:GITHUB_WORKSPACE\app.err" -ErrorAction SilentlyContinue
          if (-not $url) { throw "サーバーが起動しない（exited=$($p.HasExited)）" }
          $r = Invoke-RestMethod "$url/api/state"
          "roles: " + (($r.roles | ForEach-Object { $_.role }) -join ",")
          if (-not (Test-Path "$env:ProgramData\Company\.git")) { throw "作業場が git のリポジトリになっていない" }
          Start-Sleep -Seconds 8
          $win = Get-Process | Where-Object { $_.MainWindowTitle -eq "Company" }
          if (-not $win) { Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object ProcessName, MainWindowTitle; throw "Company のウィンドウが無い" }
          "window: " + $win.ProcessName + " / " + $win.MainWindowTitle
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE\window.png")
          # ここから先が「本当に動くか」。入って開くだけでは分からない（ユーザーの機械では開いても動かなかった）
          $json = @{ "Content-Type" = "application/json" }
          Invoke-RestMethod -Method Post "$url/api/settings" -Headers $json -Body '{"provider":"builtin","model":"qwen2.5-0.5b","max_turns":4,"context":4096,"gpu_layers":0}' | Out-Null
          Invoke-RestMethod -Method Post "$url/api/download" -Headers $json -Body '{"model_id":"qwen2.5-0.5b"}' | Out-Null
          $got = $false
          foreach ($i in 1..180) {
            Start-Sleep -Seconds 5
            $models = Invoke-RestMethod "$url/api/models?provider=builtin"
            $m = $models.catalog | Where-Object { $_.id -eq "qwen2.5-0.5b" }
            if ($m -and $m.downloaded) { $got = $true; break }
          }
          if (-not $got) { throw "模型を取れない（C:\LLM\gguf に置けていない）" }
          "model: " + (Get-ChildItem "C:\LLM\gguf" | ForEach-Object { $_.Name + " " + $_.Length }) -join ", "
          $c = Invoke-RestMethod -Method Post "$url/api/check" -Headers $json -Body '{"provider":"builtin","model":"qwen2.5-0.5b"}'
          "check: " + ($c | ConvertTo-Json -Compress)
          if ($c.error) { throw "内蔵の模型が答えない: $($c.error)" }
          $run = Invoke-RestMethod -Method Post "$url/api/runs" -Headers $json -Body '{"kind":"role","target":"ceo","instruction":"会社の状態を 1 行で言うだけでよい。ファイルは書かない。"}'
          $done = $false
          foreach ($i in 1..120) {
            Start-Sleep -Seconds 5
            $r = Invoke-RestMethod "$url/api/runs/$($run.id)"
            if ($r.status -ne "running") { $done = $true; break }
          }
          "run: " + $r.status + " events=" + $r.events.Count; $r.events | Where-Object { $_.type -in @("error","role_end","text") } | ForEach-Object { ($_ | ConvertTo-Json -Compress) }
          if (-not $done) { throw "1 役職の実走が 10 分で終わらない" }
          if ($r.status -eq "error") { throw "実走が落ちた" }
          $csv = "$env:ProgramData\Company\data\runs.csv"
          if (-not (Test-Path $csv)) { throw "data\runs.csv が無い（実走の記録が残っていない）" }
          Get-Content $csv
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 3
          # ショートカットと同じ起こし方（pythonw -E -s app.py、作業ディレクトリは Program Files）。ユーザーの機械では「起動すらしない」
          $q = Start-Process -FilePath "$dir\python\pythonw.exe" -ArgumentList "-E","-s","app.py" -WorkingDirectory $dir -PassThru
          $win2 = $null
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            if ($q.HasExited) { break }
            $win2 = Get-Process | Where-Object { $_.MainWindowTitle -eq "Company" }
            if ($win2) { break }
          }
          Get-Content "$env:ProgramData\Company\logs\app.log" -ErrorAction SilentlyContinue
          if (-not $win2) { throw "ショートカットの起こし方（pythonw -E -s）で Company のウィンドウが開かない（exited=$($q.HasExited) code=$($q.ExitCode)）" }
          "shortcut-window: " + $win2.ProcessName + " / " + $win2.MainWindowTitle
          Stop-Process -Id $q.Id -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshot
          path: |
            window.png
            app.log
            app.err
          if-no-files-found: ignore

  release:
    # Windows で開くのを見てから公開する
    needs: windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Company-Setup
          path: dist
      - name: 公開する版として置く
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          gh release view "$tag" >/dev/null 2>&1 && { echo "$tag は公開済み"; exit 0; }
          gh release create "$tag" dist/Company-Setup.exe --target "$GITHUB_SHA" --title "Company $tag" \
            --notes "Company-Setup.exe を実行して入れます（管理者の権限を求められます）。プログラムは Program Files、作業場は ProgramData\\Company、模型は C:\\LLM\\gguf に置かれます。初回は右パネルからモデルを取得してください。更新は右パネルの「更新を確かめる」から。"
