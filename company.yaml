# 会社の「設定ファイル」。ここを書き換えると全エージェントの前提が変わる。
# !!! 以下の4項目は「仮置き」です。オーナーが決めるべき内容を、
# !!! 仕組みを動かすために暫定で埋めてあります。実際の事業内容に書き換えてください。
company:
  name: "仮）Solo Retention"
  # 一文で言える存在理由。ここが曖昧だとエージェントの出力も曖昧になる。
  mission: "個人でSaaSを運営する人が、解約されてから気づく状態をなくす"
  # 誰のために作るのか。ペルソナではなく「観測可能な集団」で書く。
  customer: "有料ユーザーが10〜300人規模の、個人運営SaaSの開発者"
  # 収益モデル。無いなら「未定」と書く。嘘を書くとKPIが機能しない。
  business_model: "月額サブスクリプション（無料枠あり）"
  stage: "idea"  # idea | prototype | launched | scaling
  currency: "JPY"

# 人間（オーナー）が握り続ける権限。AIはここに触れない。
human_authority:
  - "法人設立・登記・契約の締結"
  - "資金の支出と価格の最終決定"
  - "採用と解雇"
  - "対外的な公式発信の最終承認"
  - "company.yaml と charter.md の変更"

# AIが人間の承認なしに実行してよい範囲。
autonomy:
  max_spend_per_action: 0        # 円。0 = 支出は常に人間承認。
  can_publish_externally: false  # false = 下書きまで。公開は人間。
  can_write_code: true
  can_merge_pull_requests: false

# 経営リズム。cadence を変えると run.py の対象が変わる。
cadence:
  daily: ["ops"]
  weekly: ["ceo", "cto", "cmo", "cfo", "ops"]
  monthly: ["ceo", "cfo"]

# 北極星指標と、それを支える先行指標。数値は毎週 metrics.csv から読む。
kpi:
  north_star: "解約予兆アラートを週次で受け取っている有料アカウント数"
  guardrails:
    - "現金残高がゼロ以下にならない"
    - "顧客への約束を、実装より先に公開しない"

model:
  # Anthropic API のモデルID
  default: "claude-sonnet-5"
  # 戦略判断・矛盾検出など、深く考えさせたい役職はこちら
  deep: "claude-opus-5"
