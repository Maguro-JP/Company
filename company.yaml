# 会社の設定。AIはこの前提で自律的に動く。
company:
  name: "Company"
  mission: "オーナーが作ったツールを 1 つの会社として束ね、AI の役職が回す。各ツールは人が当たり前に使え、Company を 1 つ繋げば全部が AI の道具になる"
  customer: "オーナー自身と、既製品や自作のツールを AI で動かしたい人"
  business_model: "Company 本体の販売と、ツールとのセット売り。抱き合わせにせず、Company にしか無い機能（検品、セキュリティ、法令遵守）を売る"
  stage: "prototype"
  currency: "JPY"

# AIが人間の承認なしに実行してよいこと。
# ここが true のものは、確認を取らずに実行する。止めたい項目だけ false にする。
autonomy:
  write_code: true          # コードを書く
  run_tests: true           # テストを実行する
  commit: true              # コミットする
  push: true                # push してPRを出す
  decide_roadmap: true      # 次に何を作るかを決める
  decide_pricing: true      # 価格を決める（実際の課金設定は別）
  publish_externally: false # 対外的な文章の公開はオーナーの承認を経る
  spend_money: false        # 支払い手段を持っていないため実行できない

# AIが物理的に実行できないこと。禁止ではなく、手段が無いという意味。
# 該当する作業は「オーナー作業リスト」として書き出す。
blocked_on_owner:
  - "新しいツール（子会社）のリポジトリを作る・公開する"
  - "法人登記・銀行口座・決済アカウントの開設（本人確認が必要）"
  - "クレジットカードでの支払い（カードを持っていない）"
  - "法的拘束力のある契約への署名"

cadence:
  build: ["ceo", "builder"]       # 次の一手を決めて、実装してコミットする
  review: ["ceo", "cfo", "ops"]   # 進捗と数字を見る

kpi:
  north_star: "Company から口が通って実際に使えるオーナーのツールの数"
  guardrails:
    - "テストが落ちている状態でコミットしない"
    - "オーナーのデータを外部サービスに送らない"
    - "子会社（相手のツール）の中身に手を入れない。口だけでつなぐ"

# モデルとプロバイダは画面の「設定」（data/settings.json）で選ぶ。
